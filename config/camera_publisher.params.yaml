camera_publisher:
  ros__parameters:
    device_index: 0
    width: 640
    height: 360
    fps: 30.0
    frame_id: camera_optical_frame
    image_topic: /camera/image_raw
    camera_info_topic: /camera/camera_info
    use_msmf: true
    max_frames: 0
    calibration_file: ''

    # Калибровочные параметры намеренно не заданы в базовом профиле.
    # Узел сам построит временный шаблон CameraInfo по реальному размеру кадра.
    # Для реальной калибровки можно либо заполнить template-файл ниже вручную,
    # либо передать стандартный YAML из camera_calibration через calibration_file.

image_counter:
  ros__parameters:
    image_topic: /camera/image_raw
    max_frames: 0
